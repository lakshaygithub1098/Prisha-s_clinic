services:
  - type: web
    name: prisha-clinic-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @prisha/backend build
    startCommand: pnpm --filter @prisha/backend start
    healthCheckPath: /api/v1/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: MONGODB_DATABASE
        value: prisha_clinic
      - key: DOCTOR_SIGNUP_INVITE_CODE
        sync: false
      - key: CORS_ORIGINS
        value: https://patient-web-weld.vercel.app,https://doctor-portal-mu-self.vercel.app
      - key: MONGODB_URI
        sync: false
